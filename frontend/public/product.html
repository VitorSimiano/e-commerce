<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Produto | Loja de Camisas</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js" defer></script>
  <script src="/js/config.js" defer></script>
  <script src="/js/utils.js" defer></script>
  <script src="/js/api.js" defer></script>
  <script src="/js/nav.js" defer></script>
  <script src="/js/product.js" defer></script>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="/index.html">⚽ Loja de Camisas</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
              data-bs-target="#nav" aria-controls="nav" aria-label="Abrir menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="/index.html">Catálogo</a></li>
        </ul>
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link" href="/cart.html">
              🛒 Carrinho <span id="cart-badge" class="badge rounded-pill text-bg-danger d-none">0</span>
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <a href="/index.html" class="btn btn-link px-0 mb-3">← Voltar ao catálogo</a>

    <div id="loading" class="text-center py-5">
      <div class="spinner-border" role="status">
        <span class="visually-hidden">Carregando...</span>
      </div>
    </div>

    <div id="error" class="alert alert-danger d-none" role="alert"></div>

    <div id="product" class="row g-4 d-none">
      <div class="col-12 col-md-5">
        <div class="img-placeholder rounded">👕</div>
      </div>

      <div class="col-12 col-md-7">
        <p id="p-category" class="text-muted mb-1"></p>
        <h1 id="p-name" class="h3"></h1>
        <p id="p-team" class="text-muted"></p>
        <p id="p-price" class="display-6"></p>
        <p id="p-description"></p>
        <div id="p-availability" class="mb-3"></div>

        <h2 class="h6">Tamanho</h2>
        <div id="p-sizes" class="d-flex flex-wrap gap-2 mb-3"></div>

        <div class="mb-3" style="max-width: 180px;">
          <label for="p-quantity" class="form-label">Quantidade</label>
          <input id="p-quantity" type="number" class="form-control" min="1" value="1" disabled>
          <div id="p-stock-info" class="form-text">Escolha um tamanho.</div>
        </div>

        <button id="add-to-cart" type="button" class="btn btn-primary btn-lg" disabled>
          Adicionar ao carrinho
        </button>
        <div id="cart-feedback" class="d-none" role="status"></div>
      </div>
    </div>
  </main>
</body>
</html>
