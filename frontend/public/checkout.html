
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Finalizar pedido | Loja de Camisas</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js" defer></script>
  <script src="/js/config.js" defer></script>
  <script src="/js/utils.js" defer></script>
  <script src="/js/api.js" defer></script>
  <script src="/js/auth.js" defer></script>
  <script src="/js/nav.js" defer></script>
  <script src="/js/checkout.js" defer></script>
</head>

<body>
  <header id="site-nav" data-page="checkout"></header>

  <main class="container py-4">
    <h1 class="h3 mb-4">Finalizar pedido</h1>

    <div id="loading" class="text-center py-5">
      <div class="spinner-border" role="status"></div>
      <p class="mt-2">Carregando checkout...</p>
    </div>

    <div id="error" class="alert alert-danger d-none"></div>

    <div id="empty" class="alert alert-info d-none">
      Seu carrinho está vazio.
      <a href="/index.html">Voltar ao catálogo</a>
    </div>

    <div id="checkout" class="row g-4 d-none">
      <section class="col-lg-7">
        <div class="card">
          <div class="card-body">
            <h2 class="h5 mb-3">Endereço de entrega</h2>

            <form id="checkout-form">
              <div class="mb-3">
                <label class="form-label" for="shipping_name">Nome completo</label>
                <input class="form-control" id="shipping_name" name="shipping_name" required maxlength="255">
              </div>

              <div class="mb-3">
                <label class="form-label" for="shipping_phone">Telefone</label>
                <input class="form-control" id="shipping_phone" name="shipping_phone" required maxlength="30">
              </div>

              <div class="mb-3">
                <label class="form-label" for="shipping_postal_code">CEP</label>
                <input class="form-control" id="shipping_postal_code" name="shipping_postal_code" required maxlength="20">
              </div>

              <div class="mb-3">
                <label class="form-label" for="shipping_address">Endereço</label>
                <input class="form-control" id="shipping_address" name="shipping_address" required maxlength="255">
              </div>

              <div class="row">
                <div class="col-md-4 mb-3">
                  <label class="form-label" for="shipping_number">Número</label>
                  <input class="form-control" id="shipping_number" name="shipping_number" required maxlength="30">
                </div>

                <div class="col-md-8 mb-3">
                  <label class="form-label" for="shipping_complement">Complemento</label>
                  <input class="form-control" id="shipping_complement" name="shipping_complement" maxlength="255">
                </div>
              </div>

              <div class="mb-3">
                <label class="form-label" for="shipping_neighborhood">Bairro</label>
                <input class="form-control" id="shipping_neighborhood" name="shipping_neighborhood" required maxlength="255">
              </div>

              <div class="row">
                <div class="col-md-8 mb-3">
                  <label class="form-label" for="shipping_city">Cidade</label>
                  <input class="form-control" id="shipping_city" name="shipping_city" required maxlength="255">
                </div>

                <div class="col-md-4 mb-3">
                  <label class="form-label" for="shipping_state">Estado (UF)</label>
                  <input class="form-control text-uppercase" id="shipping_state" name="shipping_state" required minlength="2" maxlength="2">
                </div>
              </div>

              <div id="form-error" class="alert alert-danger d-none"></div>

              <button id="submit-button" type="submit" class="btn btn-primary w-100">
                Confirmar pedido
              </button>
            </form>
          </div>
        </div>
      </section>

      <aside class="col-lg-5">
        <div class="card">
          <div class="card-body">
            <h2 class="h5 mb-3">Resumo da compra</h2>

            <div id="items"></div>

            <hr>

            <div class="d-flex justify-content-between">
              <span>Quantidade de itens</span>
              <strong id="item-count"></strong>
            </div>

            <div class="d-flex justify-content-between mt-2">
              <span>Total</span>
              <strong id="total" class="fs-4"></strong>
            </div>

            <p class="text-muted small mt-3 mb-0">
              O estoque será reservado e o preço será registrado no pedido quando você confirmar a compra.
            </p>
          </div>
        </div>
      </aside>
    </div>
  </main>
</body>
</html>
