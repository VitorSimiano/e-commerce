
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Detalhes do pedido | Loja de Camisas</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js" defer></script>
  <script src="/js/config.js" defer></script>
  <script src="/js/utils.js" defer></script>
  <script src="/js/api.js" defer></script>
  <script src="/js/auth.js" defer></script>
  <script src="/js/nav.js" defer></script>
  <script src="/js/order.js" defer></script>
</head>

<body>
  <header id="site-nav" data-page="order"></header>

  <main class="container py-4">
    <a href="/orders.html" class="text-decoration-none">← Meus pedidos</a>

    <div id="loading" class="text-center py-5">
      <div class="spinner-border" role="status"></div>
      <p class="mt-2">Carregando pedido...</p>
    </div>

    <div id="error" class="alert alert-danger d-none mt-3"></div>

    <div id="order" class="d-none mt-4">
      <div class="d-flex justify-content-between align-items-start flex-wrap gap-3 mb-4">
        <div>
          <h1 class="h3 mb-1" id="order-title"></h1>
          <p class="text-muted mb-0" id="order-date"></p>
        </div>

        <span id="order-status" class="badge fs-6"></span>
      </div>

      <div class="row g-4">
        <section class="col-lg-7">
          <div class="card mb-4">
            <div class="card-body">
              <h2 class="h5 mb-3">Itens do pedido</h2>

              <div class="table-responsive">
                <table class="table align-middle">
                  <thead>
                    <tr>
                      <th>Produto</th>
                      <th>Tamanho</th>
                      <th>Qtd.</th>
                      <th class="text-end">Subtotal</th>
                    </tr>
                  </thead>
                  <tbody id="order-items"></tbody>
                </table>
              </div>

              <div class="d-flex justify-content-between border-top pt-3">
                <strong>Total</strong>
                <strong id="order-total" class="fs-4"></strong>
              </div>
            </div>
          </div>

          <div class="card">
            <div class="card-body">
              <h2 class="h5 mb-3">Endereço de entrega</h2>
              <div id="shipping-info"></div>
            </div>
          </div>
        </section>

        <aside class="col-lg-5">
          <div class="card">
            <div class="card-body">
              <h2 class="h5 mb-3">Ações do pedido</h2>

              <p id="status-description" class="text-muted"></p>

              <button id="pay-button" class="btn btn-success w-100 mb-2 d-none">
                Confirmar pagamento simulado
              </button>

              <button id="cancel-button" class="btn btn-outline-danger w-100 d-none">
                Cancelar pedido
              </button>

              <div id="action-message" class="alert d-none mt-3 mb-0"></div>
            </div>
          </div>
        </aside>
      </div>
    </div>
  </main>
</body>
</html>
