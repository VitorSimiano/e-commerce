<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catálogo | Loja de Camisas</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js" defer></script>
  <script src="/js/config.js" defer></script>
  <script src="/js/utils.js" defer></script>
  <script src="/js/api.js" defer></script>
<script src="/js/nav.js" defer></script>
<script src="/js/catalog.js" defer></script>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="/index.html"> Loja de Camisas</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
              data-bs-target="#nav" aria-controls="nav" aria-label="Abrir menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav">
       <ul class="navbar-nav me-auto">
  <li class="nav-item">
    <a class="nav-link active" aria-current="page" href="/index.html">Catálogo</a>
  </li>
</ul>
<ul class="navbar-nav">
  <li class="nav-item">
    <a class="nav-link" href="/cart.html">
      Carrinho <span id="cart-badge" class="badge rounded-pill text-bg-danger d-none">0</span>
    </a>
  </li>
</ul>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <h1 class="h3 mb-3">Camisas de futebol</h1>

    <form id="filters-form" class="row g-2 mb-4">
      <div class="col-12 col-md-4">
        <div class="input-group">
          <input id="filter-search" type="search" class="form-control"
                 placeholder="Buscar pelo nome" maxlength="100">
          <button class="btn btn-primary" type="submit">Buscar</button>
        </div>
      </div>
      <div class="col-6 col-md-2">
        <select id="filter-category" class="form-select" aria-label="País">
          <option value="">Todos os países</option>
        </select>
      </div>
      <div class="col-6 col-md-2">
        <select id="filter-size" class="form-select" aria-label="Tamanho">
          <option value="">Todos os tamanhos</option>
          <option value="P">P</option>
          <option value="M">M</option>
          <option value="G">G</option>
          <option value="GG">GG</option>
        </select>
      </div>
      <div class="col-8 col-md-2">
        <select id="filter-sort" class="form-select" aria-label="Ordenação">
          <option value="newest">Mais recentes</option>
          <option value="price_asc">Menor preço</option>
          <option value="price_desc">Maior preço</option>
        </select>
      </div>
      <div class="col-4 col-md-2 d-grid">
        <button type="button" id="filter-clear" class="btn btn-outline-secondary">Limpar</button>
      </div>
    </form>

    <div id="loading" class="text-center py-5">
      <div class="spinner-border" role="status">
        <span class="visually-hidden">Carregando...</span>
      </div>
    </div>

    <div id="error" class="alert alert-danger d-none" role="alert"></div>

    <div id="empty" class="alert alert-info d-none" role="alert">
      Nenhuma camisa encontrada para esses filtros. Tente outro nome ou clique em Limpar.
    </div>

    <p id="summary" class="text-muted small d-none"></p>
    <div id="grid" class="row row-cols-1 row-cols-sm-2 row-cols-lg-4 g-4 d-none"></div>
    <nav id="pagination" class="mt-4 d-none" aria-label="Paginação"></nav>
  </main>
</body>
</html>
