<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carrinho | Loja de Camisas</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">

 <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js" defer></script>
<script src="/js/config.js" defer></script>
<script src="/js/utils.js" defer></script>
<script src="/js/api.js" defer></script>
<script src="/js/auth.js" defer></script>
<script src="/js/nav.js" defer></script>
<script src="/js/cart.js" defer></script>
</head>
<body>
  <header id="site-nav" data-page="cart"></header>

  <main class="container py-4">
    <h1 class="h3 mb-3">Seu carrinho</h1>

    <div id="loading" class="text-center py-5">
      <div class="spinner-border" role="status">
        <span class="visually-hidden">Carregando...</span>
      </div>
    </div>

    <div id="error" class="alert alert-danger d-none" role="alert"></div>
    <div id="notice" class="alert alert-warning d-none" role="status"></div>

    <div id="empty" class="text-center py-5 d-none">
      <p class="lead">Seu carrinho está vazio.</p>
      <a href="/index.html" class="btn btn-primary">Ver o catálogo</a>
    </div>

    <div id="cart" class="d-none">
      <div class="table-responsive">
        <table class="table align-middle">
          <thead>
            <tr>
              <th>Produto</th>
              <th>Tamanho</th>
              <th class="text-end">Preço</th>
              <th style="width: 130px;">Qtd.</th>
              <th class="text-end">Subtotal</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="cart-body"></tbody>
        </table>
      </div>

      <div class="d-flex justify-content-between align-items-center border-top pt-3">
        <span class="fs-5">Total (<span id="cart-count"></span> item(ns))</span>
        <strong id="cart-total" class="fs-3"></strong>
      </div>
      <p class="text-muted small mt-2">
        Os valores são calculados pelo servidor, com o preço atual de cada camisa.
      </p>
    </div>
  </main>
</body>
</html>
