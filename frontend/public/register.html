<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastrar | Loja de Camisas</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js" defer></script>
  <script src="/js/config.js" defer></script>
  <script src="/js/utils.js" defer></script>
  <script src="/js/api.js" defer></script>
  <script src="/js/auth.js" defer></script>
  <script src="/js/nav.js" defer></script>
  <script src="/js/register.js" defer></script>
</head>
<body>
  <header id="site-nav" data-page="register"></header>

  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-5">
        <h1 class="h3 mb-3">Criar conta</h1>

        <div id="form-alert" class="alert alert-danger d-none" role="alert"></div>

        <form id="register-form" novalidate>
          <div class="mb-3">
            <label for="name" class="form-label">Nome</label>
            <input id="name" name="name" type="text" class="form-control" autocomplete="name" required>
            <div class="invalid-feedback" data-feedback="name"></div>
          </div>

          <div class="mb-3">
            <label for="email" class="form-label">E-mail</label>
            <input id="email" name="email" type="email" class="form-control" autocomplete="email" required>
            <div class="invalid-feedback" data-feedback="email"></div>
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">Senha</label>
            <input id="password" name="password" type="password" class="form-control" autocomplete="new-password" required>
            <div class="form-text">Mínimo de 8 caracteres.</div>
            <div class="invalid-feedback" data-feedback="password"></div>
          </div>

          <div class="mb-3">
            <label for="password_confirmation" class="form-label">Confirmar senha</label>
            <input id="password_confirmation" name="password_confirmation" type="password" class="form-control" autocomplete="new-password" required>
            <div class="invalid-feedback" data-feedback="password_confirmation"></div>
          </div>

          <button id="submit-button" type="submit" class="btn btn-primary w-100">Criar conta</button>
        </form>

        <p class="mt-3 text-center">
          Já tem conta? <a id="login-link" href="/login.html">Entrar</a>
        </p>
      </div>
    </div>
  </main>
</body>
</html>
