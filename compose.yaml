services:
  mysql:
    image: mysql:8.4
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: loja_camisas
      MYSQL_USER: loja_camisas
      MYSQL_PASSWORD: loja_camisas
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--protocol=tcp"]
      interval: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DB_HOST: mysql
    volumes:
      - ./backend:/app
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/up"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    environment:
      API_URL: http://localhost:8000/api
    volumes:
      - ./frontend/public:/usr/share/nginx/html:ro

volumes:
  mysql_data: